# NexKV CI 工作流
# 在 push 和 pull request 时自动运行测试

name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', '1.23']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: 显示 Go 版本
        run: go version

      - name: 下载依赖
        run: |
          go mod download
          go mod verify

      - name: 运行测试
        env:
          CI: "true"
        run: |
          if [ "${{ matrix.go-version }}" = "1.24" ]; then
            # 最新版本运行完整测试（含 race detector），跳过集成测试
            go test -v -race -timeout 20m -coverprofile=coverage.out -short ./...
          else
            # 其他版本只运行单元测试（跳过集成测试和慢测试）
            go test -v -timeout 10m -coverprofile=coverage.out -short ./...
          fi

      - name: 生成覆盖率报告
        run: go tool cover -html=coverage.out -o coverage.html

      - name: 显示覆盖率
        run: go tool cover -func=coverage.out

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: |
            coverage.out
            coverage.html

      - name: 运行 go vet
        run: go vet ./...

      - name: 检查代码格式
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "以下文件需要格式化:"
            gofmt -s -l .
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          skip-pkg-cache: true

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.24', '1.23']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: 编译项目
        shell: bash
        run: |
          go build -v -ldflags="-s -w" -o bin/nexkv ./cmd/nexkv
          # nexkd 将在后续 Phase 实现，暂不编译

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: nexkv-${{ matrix.os }}-go${{ matrix.go-version }}
          path: bin/
