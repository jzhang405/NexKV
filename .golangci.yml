version: 2

linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: false
    enable:
      - atomic
      - nilfunc
      - printf
      - shadow

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  concurrency: 4
  modules-download-mode: readonly
