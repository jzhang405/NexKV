version: 2

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
  disable:
    - errcheck
    - gosec      # 安全检查，暂时禁用
    - dupl       # 重复代码检测，暂时禁用
    - gocyclo    # 圈复杂度，暂时禁用

linters-settings:
  govet:
    enable-all: false
    enable:
      - atomic
      - shadow
      - copylocks

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    # 排除一些误报
    - linters:
        - staticcheck
      text: "SA9003:"  # 忽略无用的类型转换建议
    # 允许 main 函数中使用 fmt.Println
    - path: cmd/
      linters:
        - staticcheck
      text: "SA9002:"
