# NexKV 集群配置示例（包含种子节点配置）
#
# PR-036: 支持从配置文件获取种子节点地址列表
# 使用 IPFS multiaddr 格式: /ip4/<IP>/tcp/<PORT>

cluster:
  name: "nexkv-cluster"
  node_id: "node-1"
  # 节点地址使用 IPFS multiaddr 格式（PR-036）
  node_addr: "/ip4/127.0.0.1/tcp/9211"

  # 种子节点配置（可选）
  # 格式 1: YAML 数组
  seed_nodes:
    - "/ip4/127.0.0.1/tcp/7946"
    - "/ip4/127.0.0.1/tcp/7947"

  # 格式 2: 逗号分隔字符串（备用）
  # seed_nodes: "/ip4/127.0.0.1/tcp/7946,/ip4/127.0.0.1/tcp/7947"

  # 支持的 multiaddr 格式：
  # - IPv4: /ip4/192.168.1.10/tcp/9211
  # - IPv6: /ip6/::1/tcp/9211
  # - DNS:  /dns4/localhost/tcp/9211

metadata:
  data_dir: "./data/metadata"
  gossip_interval: "10s"
  quorum_timeout: "30s"
  change_log_size: 1000

storage:
  shard_data_dir: "./data/shards"
  wal_dir: "./data/wal"
  snapshot_dir: "./data/snapshots"
  flush_interval: "5s"

network:
  listen_addr: "0.0.0.0:9211"
  transport_type: "tcp"
  message_pack_type: "msgpack"
  max_message_size: 10485760  # 10MB
  connect_timeout: "10s"

logging:
  level: "info"
  format: "json"
  output: "stdout"
  file: ""

clock:
  hlc:
    max_drift: 100  # 100ms
    sync_interval: "10s"
