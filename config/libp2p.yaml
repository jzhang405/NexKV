# NexKV 集群配置 - libp2p Transport
# 完整配置示例

# 集群配置
cluster:
  # 节点 ID（必须唯一）
  node_id: 1

  # Transport 配置
  transport:
    # Transport 类型：libp2p
    type: libp2p

    # libp2p 配置
    libp2p:
      # 监听端口
      listen_port: 4001

      # 监听地址
      listen_addr: "0.0.0.0"

      # 对外公布的地址列表（可选，用于NAT穿透）
      announce_addrs:
        - "/ip4/192.168.1.1/tcp/4001"
        # - "/dns4/node1.example.com/tcp/4001"

      # 私钥文件路径
      private_key_path: "/var/lib/nexkv/libp2p_key"

      # 连接管理器配置（可选）
      connection_manager:
        # 低水位（最小连接数）
        low_water: 100
        # 高水位（最大连接数）
        high_water: 400

      # 节点发现配置
      discovery:
        # mDNS 局域网发现
        mdns:
          enabled: true
          service_tag: "nexkv-discovery"

      # Bootstrap 节点列表（可选，用于初始连接）
      bootstrap:
        - "/ip4/1.2.3.4/tcp/4001/p2p/QmBootstrap"

# 日志配置
logging:
  level: "info"       # 日志级别: debug, info, warn, error
  format: "json"      # 日志格式: json, text
  output: "/var/log/nexkv/nexkv.log"

# 数据目录
data_dir: "/var/lib/nexkv"

# 监控配置
monitoring:
  enabled: true
  metrics_port: 9090
