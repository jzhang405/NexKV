# 元数据层配置
metadata:
  # 注意：data_dir 现在由 {base_dir}/{host_id}/metadata 自动管理
  # 此处仅配置行为参数
  gossip_interval: "10s"
  quorum_timeout: "30s"
  change_log_size: 1000

# 存储层配置
storage:
  # 注意：目录路径现在由 {base_dir}/{host_id}/{shards|wal|snapshots} 自动管理
  # 此处仅配置行为参数
  flush_interval: "5s"

# 网络层配置
network:
  transport_type: "tcp"
  message_pack_type: "msgpack"
  max_message_size: 10485760  # 10MB
  connect_timeout: "10s"

# 日志配置
logging:
  level: "info"
  format: "json"
  output: "stdout"
  file: ""

# 时钟服务配置
clock:
  hlc:
    max_drift: 100  # 100ms
    sync_interval: "10s"
