# NexKV 集群配置（三级结构：Cluster → Host → Node）
#
# PR-037: 三级配置重构
# - Cluster: 集群级别配置（名称、基础目录）
# - Host: 主机级别配置（每个物理机/容器一个 Host）
# - Node: 节点级别配置（角色由系统动态分配）
#
# 部署模式：15 个 Host，每个 Host 1 个 Node（完全分布式部署）

cluster:
  name: "nexkv-cluster"
  # 基础目录（可被 NEXKV_BASE_DIR 环境变量覆盖）
  base_dir: "~/.nexkv"

  # Host 级别配置（15 个 Host，每个 1 个 Node）
  hosts:
    # Host-1
    - host_id: "host-1"
      seed_node: "/ip4/127.0.0.1/tcp/9211"
      nodes:
        - node_id: "node-1"
          node_addr_tcp: "/ip4/127.0.0.1/tcp/9211"
          node_addr_udp: "/ip4/127.0.0.1/udp/9212"

    # Host-2
    - host_id: "host-2"
      seed_node: "/ip4/127.0.0.1/tcp/9211"  # 指向种子节点 (host-1)
      nodes:
        - node_id: "node-2"
          node_addr_tcp: "/ip4/127.0.0.1/tcp/9213"
          node_addr_udp: "/ip4/127.0.0.1/udp/9214"

