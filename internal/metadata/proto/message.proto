syntax = "proto3";

package nexkv.metadata.transport;

option go_package = "github.com/jzhang405/NexKV/internal/metadata/proto";

// ========================================
// 消息类型枚举
// ========================================

// MessageType 消息类型
enum MessageType {
  // 元数据操作消息 (100-149)
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_GET = 100;
  MESSAGE_TYPE_PUT = 101;
  MESSAGE_TYPE_DELETE = 102;
  MESSAGE_TYPE_GET_REPLY = 103;
  MESSAGE_TYPE_PUT_REPLY = 104;
  MESSAGE_TYPE_DELETE_REPLY = 105;

  // Gossip 协议消息 (150-199)
  MESSAGE_TYPE_GOSSIP_SYNC = 150;
  MESSAGE_TYPE_GOSSIP_SYNC_REPLY = 151;
  MESSAGE_TYPE_GOSSIP_DIGEST = 152;
  MESSAGE_TYPE_GOSSIP_DIGEST_REPLY = 153;

  // Quorum 协议消息 (200-249)
  MESSAGE_TYPE_QUORUM_PROPOSE = 200;
  MESSAGE_TYPE_QUORUM_VOTE = 201;
  MESSAGE_TYPE_QUORUM_DECIDE = 202;

  // 2PC 协议消息 (250-299)
  MESSAGE_TYPE_2PC_PREPARE = 250;
  MESSAGE_TYPE_2PC_PREPARE_REPLY = 251;
  MESSAGE_TYPE_2PC_COMMIT = 252;
  MESSAGE_TYPE_2PC_ROLLBACK = 253;
  MESSAGE_TYPE_2PC_COMMIT_REPLY = 254;
  MESSAGE_TYPE_2PC_ROLLBACK_REPLY = 255;

  // 节点管理消息 (300-349)
  MESSAGE_TYPE_NODE_PING = 300;
  MESSAGE_TYPE_NODE_PONG = 301;
  MESSAGE_TYPE_NODE_JOIN = 302;
  MESSAGE_TYPE_NODE_LEAVE = 303;
  MESSAGE_TYPE_NODE_SYNC = 304;
  MESSAGE_TYPE_CLOCK_SYNC = 305;
  MESSAGE_TYPE_CLOCK_SYNC_REPLY = 306;

  // 集群管理消息 (350-399)
  MESSAGE_TYPE_CLUSTER_STATUS = 350;
  MESSAGE_TYPE_CLUSTER_STATUS_REPLY = 351;
  MESSAGE_TYPE_LEADER_ELECTION = 352;
}

// ========================================
// 元数据操作消息
// ========================================

// GetMessageProto 获取元数据消息
message GetMessageProto {
  string key = 1;
}

// PutMessageProto 更新元数据消息
message PutMessageProto {
  string key = 1;
  bytes value = 2;
}

// GetReplyMessageProto Get 响应消息
message GetReplyMessageProto {
  string key = 1;
  bytes value = 2;
  bool found = 3;
  uint64 version = 4;
}

// PutReplyMessageProto Put 响应消息
message PutReplyMessageProto {
  string key = 1;
  bool success = 2;
  uint64 version = 3;
}

// DeleteMessageProto 删除元数据消息
message DeleteMessageProto {
  string key = 1;
}

// DeleteReplyMessageProto Delete 响应消息
message DeleteReplyMessageProto {
  string key = 1;
  bool success = 2;
}

// ========================================
// Gossip 协议消息
// ========================================

// GossipSyncMessageProto Gossip 同步消息
message GossipSyncMessageProto {
  uint64 version = 1;
  map<string, bytes> metadata = 2;
  int64 timestamp = 3;
}

// GossipSyncReplyMessageProto Gossip 同步响应
message GossipSyncReplyMessageProto {
  bool accepted = 1;
  uint64 version = 2;
}

// GossipDigestMessageProto Gossip 摘要消息
message GossipDigestMessageProto {
  uint64 version = 1;
  map<string, uint64> digest = 2;
}

// GossipDigestReplyMessageProto Gossip 摘要响应
message GossipDigestReplyMessageProto {
  uint64 version = 1;
  map<string, uint64> digest = 2;
}

// ========================================
// Quorum 协议消息
// ========================================

// QuorumProposeMessageProto Quorum 提案消息
message QuorumProposeMessageProto {
  string proposal_id = 1;
  string key = 2;
  bytes value = 3;
  string operation = 4; // "put", "delete"
  string proposer = 5;
  int64 timestamp = 6;
}

// QuorumVoteMessageProto Quorum 投票消息
message QuorumVoteMessageProto {
  string proposal_id = 1;
  string voter = 2;
  bool vote = 3;
  string reason = 4;
}

// QuorumDecideMessageProto Quorum 决策消息
message QuorumDecideMessageProto {
  string proposal_id = 1;
  bool approved = 2;
  uint64 version = 3;
}

// ========================================
// 2PC 协议消息
// ========================================

// OperationProto 操作定义
message OperationProto {
  string type = 1; // "put", "delete"
  string key = 2;
  bytes value = 3;
}

// TwoPCPrepareMessageProto 2PC 准备阶段消息
message TwoPCPrepareMessageProto {
  string transaction_id = 1;
  repeated string participants = 2;
  repeated OperationProto operations = 3;
  int64 timestamp = 4;
}

// TwoPCPrepareReplyMessageProto 2PC 准备响应
message TwoPCPrepareReplyMessageProto {
  string transaction_id = 1;
  string participant = 2;
  string vote = 3; // "commit", "abort"
  string reason = 4;
}

// TwoPCCommitMessageProto 2PC 提交消息
message TwoPCCommitMessageProto {
  string transaction_id = 1;
}

// TwoPCRollbackMessageProto 2PC 回滚消息
message TwoPCRollbackMessageProto {
  string transaction_id = 1;
  string reason = 2;
}

// TwoPCCommitReplyMessageProto 2PC 提交响应
message TwoPCCommitReplyMessageProto {
  string transaction_id = 1;
  string participant = 2;
  bool success = 3;
}

// TwoPCRollbackReplyMessageProto 2PC 回滚响应
message TwoPCRollbackReplyMessageProto {
  string transaction_id = 1;
  string participant = 2;
  bool success = 3;
}

// ========================================
// 节点管理消息
// ========================================

// NodePingMessageProto 节点心跳消息
message NodePingMessageProto {
  string node_id = 1;
  int64 sequence = 2;
  int64 timestamp = 3;
}

// NodePongMessageProto 心跳响应
message NodePongMessageProto {
  string node_id = 1;
  int64 sequence = 2;
  string status = 3; // "ready", "busy", "leaving"
  int64 timestamp = 4;
}

// NodeJoinMessageProto 节点加入消息
message NodeJoinMessageProto {
  string node_id = 1;
  string addr = 2;
  string role = 3; // "parent", "child"
  string parent_id = 4;
}

// NodeLeaveMessageProto 节点离开消息
message NodeLeaveMessageProto {
  string node_id = 1;
  string reason = 2;
}

// NodeSyncMessageProto 节点同步消息
message NodeSyncMessageProto {
  uint64 version = 1;
  map<string, bytes> metadata = 2;
}

// ClockSyncMessageProto 时钟同步请求消息
message ClockSyncMessageProto {
  int64 timestamp = 1; // 发送节点的 HLC 时间戳
  string node_id = 2;   // 发送节点 ID
}

// ClockSyncReplyMessageProto 时钟同步响应消息
message ClockSyncReplyMessageProto {
  int64 timestamp = 1; // 响应节点的 HLC 时间戳
  string node_id = 2;   // 响应节点 ID
  int64 drift = 3;      // 时间漂移（毫秒）
}

// ========================================
// 集群管理消息
// ========================================

// NodeInfoProto 节点信息
message NodeInfoProto {
  string node_id = 1;
  string addr = 2;
  string role = 3;
  string parent_id = 4;
  string status = 5; // "ready", "busy", "leaving"
  int32 level = 6;
}

// ClusterStatusMessageProto 集群状态查询
message ClusterStatusMessageProto {
  string node_id = 1;
}

// ClusterStatusReplyMessageProto 集群状态响应
message ClusterStatusReplyMessageProto {
  repeated NodeInfoProto nodes = 1;
}

// LeaderElectionMessageProto Leader 选举消息
message LeaderElectionMessageProto {
  string election_id = 1;
  string node_id = 2;
  int32 priority = 3;
}

// ========================================
// 包装消息（统一入口）
// ========================================

// WrapperMessageProto 统一消息包装器
//
// 使用 oneof 实现消息类型判别，解决语义丢失问题
message WrapperMessageProto {
  uint32 message_type = 1; // MessageType 枚举值

  oneof message_body {
    // 元数据操作消息
    GetMessageProto get_msg = 100;
    PutMessageProto put_msg = 101;
    GetReplyMessageProto get_reply_msg = 103;
    PutReplyMessageProto put_reply_msg = 104;
    DeleteMessageProto delete_msg = 102;
    DeleteReplyMessageProto delete_reply_msg = 105;

    // Gossip 协议消息
    GossipSyncMessageProto gossip_sync_msg = 150;
    GossipSyncReplyMessageProto gossip_sync_reply_msg = 151;
    GossipDigestMessageProto gossip_digest_msg = 152;
    GossipDigestReplyMessageProto gossip_digest_reply_msg = 153;

    // Quorum 协议消息
    QuorumProposeMessageProto quorum_propose_msg = 200;
    QuorumVoteMessageProto quorum_vote_msg = 201;
    QuorumDecideMessageProto quorum_decide_msg = 202;

    // 2PC 协议消息
    TwoPCPrepareMessageProto twopc_prepare_msg = 250;
    TwoPCPrepareReplyMessageProto twopc_prepare_reply_msg = 251;
    TwoPCCommitMessageProto twopc_commit_msg = 252;
    TwoPCRollbackMessageProto twopc_rollback_msg = 253;
    TwoPCCommitReplyMessageProto twopc_commit_reply_msg = 254;
    TwoPCRollbackReplyMessageProto twopc_rollback_reply_msg = 255;

    // 节点管理消息
    NodePingMessageProto node_ping_msg = 300;
    NodePongMessageProto node_pong_msg = 301;
    NodeJoinMessageProto node_join_msg = 302;
    NodeLeaveMessageProto node_leave_msg = 303;
    NodeSyncMessageProto node_sync_msg = 304;
    ClockSyncMessageProto clock_sync_msg = 305;
    ClockSyncReplyMessageProto clock_sync_reply_msg = 306;

    // 集群管理消息
    ClusterStatusMessageProto cluster_status_msg = 350;
    ClusterStatusReplyMessageProto cluster_status_reply_msg = 351;
    LeaderElectionMessageProto leader_election_msg = 352;
  }
}
