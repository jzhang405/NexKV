syntax = "proto3";

package nexkv.metadata;

option go_package = "github.com/jzhang405/NexKV/proto";

// MetadataTransport - 元数据层传输服务
//
// 这个服务定义了 NexKV 元数据层节点间的通信协议。
// 支持 Gossip 协议、投票机制、2PC 提交协议等。
service MetadataTransport {
	// ===== Gossip 协议 =====

	// GossipExchange 节点间知识交换
	//
	// 用于传播节点的投票状态和决策状态。
	// 这是最终一致性协议的核心消息类型。
	rpc GossipExchange(GossipRequest) returns (GossipResponse);

	// ===== 投票协议 =====

	// ProposeVote 发起投票提议
	//
	// 节点发起对一个版本的投票。
	rpc ProposeVote(ProposeVoteRequest) returns (ProposeVoteResponse);

	// AckVote 确认投票
	//
	// 节点确认自己已经投票。
	rpc AckVote(AckVoteRequest) returns (AckVoteResponse);

	// ===== 决策协议 =====

	// DecisionNotify 决策通知
	//
	// 节点通知其他节点自己的决策状态。
	rpc DecisionNotify(DecisionNotifyRequest) returns (DecisionNotifyResponse);

	// ===== 2PC 两阶段提交协议 =====

	// SendPrepare 发送 Prepare 阶段请求
	//
	// 协调者向参与者发送 prepare 请求。
	rpc SendPrepare(PrepareRequest) returns (PrepareResponse);

	// SendVote 发送投票决策
	//
	// 参与者向协调者发送投票结果（yes/no）。
	rpc SendVote(VoteRequest) returns (VoteResponse);

	// SendDecision 发送最终决策
	//
	// 协调者向参与者发送最终决策（commit/rollback）。
	rpc SendDecision(DecisionRequest) returns (DecisionResponse);

	// AckDecision 确认决策
	//
	// 参与者确认收到最终决策。
	rpc AckDecision(AckDecisionRequest) returns (AckDecisionResponse);

	// ===== 健康检查 =====

	// HealthCheck 健康检查
	//
	// 用于检测节点是否可达和正常工作。
	rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ===== Gossip 消息 =====

// Knowledge 节点知识
message Knowledge {
	map<string, bool> seen = 1;     // 已知已投票的节点
	int32 version = 2;               // 当前投票版本号
	map<string, bool> decided = 3;  // 已知已决策的节点
}

// GossipRequest Gossip 交换请求
message GossipRequest {
	string from_node = 1;    // 发送节点 ID
	Knowledge knowledge = 2; // 发送节点的知识
	int64 timestamp = 3;     // 时间戳（纳秒）
}

// GossipResponse Gossip 交换响应
message GossipResponse {
	bool accepted = 1;           // 是否接受交换
	Knowledge remote_knowledge = 2; // 远程节点的知识（用于合并）
}

// ===== 投票消息 =====

// ProposeVoteRequest 发起投票请求
message ProposeVoteRequest {
	string from_node = 1; // 发起节点 ID
	int32 version = 2;    // 投票版本号
	int64 timestamp = 3;  // 时间戳
}

// ProposeVoteResponse 发起投票响应
message ProposeVoteResponse {
	bool accepted = 1; // 是否接受投票
}

// AckVoteRequest 确认投票请求
message AckVoteRequest {
	string from_node = 1; // 投票节点 ID
	int32 version = 2;    // 投票版本号
	int64 timestamp = 3;  // 时间戳
}

// AckVoteResponse 确认投票响应
message AckVoteResponse {
	bool accepted = 1; // 是否接受确认
}

// ===== 决策消息 =====

// DecisionState 决策状态
enum DecisionState {
	DECISION_UNDECIDED = 0; // 未决策
	DECISION_COMMITTED = 1;  // 已提交
}

// DecisionNotifyRequest 决策通知请求
message DecisionNotifyRequest {
	string from_node = 1;      // 发送节点 ID
	DecisionState decision = 2; // 决策状态
	int32 version = 3;         // 版本号
	int64 timestamp = 4;       // 时间戳
}

// DecisionNotifyResponse 决策通知响应
message DecisionNotifyResponse {
	bool accepted = 1; // 是否接受通知
}

// ===== 2PC 消息 =====

// Phase 2PC 阶段
enum Phase {
	PHASE_INIT = 0;       // 初始阶段
	PHASE_PREPARE = 1;    // 准备阶段
	PHASE_DECIDE = 2;     // 决策阶段
	PHASE_DONE = 3;       // 完成阶段
}

// PrepareRequest Prepare 请求
message PrepareRequest {
	string transaction_id = 1; // 事务 ID
	string coordinator = 2;   // 协调者 ID
	int64 timestamp = 3;      // 时间戳
}

// PrepareResponse Prepare 响应
message PrepareResponse {
	bool accepted = 1;        // 是否接受 prepare
	string message = 2;       // 附加消息
}

// VoteDecision 投票决策
enum VoteDecision {
	VOTE_UNKNOWN = 0; // 未知
	VOTE_YES = 1;     // 同意
	VOTE_NO = 2;      // 拒绝
}

// VoteRequest 投票请求
message VoteRequest {
	string transaction_id = 1; // 事务 ID
	string participant = 2;    // 参与者 ID
	VoteDecision vote = 3;     // 投票决策
	int64 timestamp = 4;       // 时间戳
}

// VoteResponse 投票响应
message VoteResponse {
	bool accepted = 1;  // 是否接受投票
	string message = 2; // 附加消息
}

// DecisionRequest 决策请求
message DecisionRequest {
	string transaction_id = 1; // 事务 ID
	string coordinator = 2;    // 协调者 ID
	string decision = 3;       // 决策（commit/rollback）
	int64 timestamp = 4;       // 时间戳
}

// DecisionResponse 决策响应
message DecisionResponse {
	bool accepted = 1;  // 是否接受决策
	string message = 2; // 附加消息
}

// AckDecisionRequest 确认决策请求
message AckDecisionRequest {
	string transaction_id = 1; // 事务 ID
	string participant = 2;    // 参与者 ID
	int64 timestamp = 3;       // 时间戳
}

// AckDecisionResponse 确认决策响应
message AckDecisionResponse {
	bool accepted = 1; // 是否接受确认
}

// ===== 健康检查消息 =====

// HealthCheckRequest 健康检查请求
message HealthCheckRequest {
	string from_node = 1; // 请求节点 ID
	int64 timestamp = 2;  // 时间戳
}

// HealthCheckResponse 健康检查响应
message HealthCheckResponse {
	bool healthy = 1;    // 是否健康
	string node_id = 2;  // 节点 ID
	int32 version = 3;   // 当前版本号
	string message = 4;  // 附加消息
}
